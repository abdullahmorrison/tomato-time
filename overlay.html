<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tomato Time — overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  canvas, .timer, .status {
    position: fixed;
    pointer-events: none;
  }
  canvas {
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #splat { z-index: 1; }
  #front { z-index: 2; }

  .timer {
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px 10px 14px;
    border-radius: 14px;
    background: rgba(18, 8, 8, 0.72);
    border: 2px solid rgba(255, 255, 255, 0.14);
    font: 700 34px/1 "Segoe UI", system-ui, sans-serif;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: translateY(14px) scale(0.94);
    transition: opacity 220ms ease, transform 220ms ease;
  }
  .timer.is-visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .timer[data-corner="bottom-right"] { right: 34px; bottom: 34px; }
  .timer[data-corner="bottom-left"]  { left: 34px;  bottom: 34px; }
  .timer[data-corner="top-right"]    { right: 34px; top: 34px; }
  .timer[data-corner="top-left"]     { left: 34px;  top: 34px; }

  .timer-icon {
    width: 34px;
    height: 34px;
    image-rendering: pixelated;
  }
  .timer-value {
    min-width: 1.6ch;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .timer-label {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    opacity: 0.72;
  }
  .timer.is-urgent {
    border-color: rgba(255, 96, 80, 0.85);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { transform: scale(1.06); }
  }

  .status {
    z-index: 4;
    left: 20px;
    top: 20px;
    padding: 7px 13px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.66);
    color: #fff;
    font: 500 14px/1.4 "Segoe UI", system-ui, sans-serif;
    transition: opacity 500ms ease;
  }
  .status[hidden] { display: none; }
</style>
</head>
<body>
  <canvas id="splat"></canvas>
  <canvas id="front"></canvas>

  <div class="timer" id="timer">
    <canvas class="timer-icon" id="timerIcon" width="16" height="16"></canvas>
    <span class="timer-value">30</span>
    <span class="timer-label">Tomato&nbsp;Time</span>
  </div>

  <div class="status" id="status" hidden></div>

  <script type="module" src="./src/overlay-main.js"></script>
</body>
</html>
